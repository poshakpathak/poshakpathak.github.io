<style>
/* Layout: a whole-page desktop OS. Menu bar on top, project icons on the desktop, app windows, dock at the bottom.
   The Time Machine swaps the token set below by setting data-era on #os. Single committed look per era, so no light/dark split. */
:root{color-scheme:light}
html,body{height:100%}
body{margin:0;background:#0f1a2a;overflow:hidden;font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#os{
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
  --fg:#1b1f27; --soft:#667085; --line:#e4e7ec; --accent:#2f6fec;
  --desk:linear-gradient(#5b8fc7 0 45%,#1d4f7a 45%);
  --menu-bg:rgba(214,228,245,.72); --menu-fg:#1b1f27; --menu-blur:blur(18px);
  --win-bg:#f9fafc; --win-radius:14px; --win-border:1px solid rgba(255,255,255,.7);
  --win-shadow:0 30px 60px -12px rgba(15,30,60,.35),0 0 0 .5px rgba(15,30,60,.15);
  --tb-bg:rgba(246,247,250,.9); --tb-fg:#1b1f27; --tb-h:40px; --tb-border:1px solid #e9ecf1;
  --card:#fff; --chip:#f1f3f7;
  position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;font-family:var(--font);color:var(--fg);background:var(--desk);overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
#sea{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
#os:not([data-era="now"]) #sea{display:none}
#os::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(10,25,50,.15));z-index:0}

/* ---------- menu bar ---------- */
.menubar{position:relative;z-index:900;display:flex;align-items:center;gap:20px;height:30px;font-size:13.5px;color:var(--menu-fg);background:var(--menu-bg);backdrop-filter:var(--menu-blur);-webkit-backdrop-filter:var(--menu-blur);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid rgba(255,255,255,.4);white-space:nowrap}
.menubar .logo{width:12px;height:12px;border-radius:50%;background:currentColor;flex:none}
.menubar b{font-weight:600}
.menubar .greet{color:var(--soft);border-left:1px solid rgba(0,0,0,.15);padding-left:14px}
.menubar .sp{flex:1}
.menubar .rt{display:flex;gap:18px;align-items:center;font-variant-numeric:tabular-nums}
.menubar .rt .date{opacity:.75}
.menubar svg{width:15px;height:15px}
@media (max-width:640px){.menubar .greet,.menubar .mi,.menubar .date{display:none}}

/* ---------- desktop ---------- */
.desk{position:relative;z-index:1;min-height:0}
.dicons{position:absolute;top:24px;right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:22px;justify-items:center;z-index:2}
.proj{all:unset;cursor:pointer;display:grid;justify-items:center;gap:8px;width:108px;text-align:center}
.stack{position:relative;width:82px;height:96px}
.stack i,.stack span{position:absolute;inset:0;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 8px 18px rgba(10,20,40,.35)}
.stack i:nth-child(1){transform:rotate(-12deg) translate(-10px,4px) scale(.88);background-color:#f4f2ec;filter:brightness(.92)}
.stack i:nth-child(2){transform:rotate(11deg) translate(10px,4px) scale(.88);background-color:#f4f2ec;filter:brightness(.92)}
.stack span{border:2px solid #fff}
.proj b{font-size:13.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1.2}
.proj:hover .stack span{transform:translateY(-3px)}
.proj:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.sysicons{display:none}
.folder{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;width:100px;text-align:center;--f1:#7fb6ee;--f2:#a9d0f7;--pp:#fff}
.folder .fi{position:relative;width:76px;height:62px;transition:transform .15s}
.folder:hover .fi{transform:translateY(-3px)}
.folder .fi>svg{width:76px;height:62px;filter:drop-shadow(0 6px 10px rgba(10,20,40,.3))}
.folder .fi>svg *{stroke:none}
.folder .gl{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);color:rgba(30,80,140,.55);display:grid}
.folder .gl svg{width:22px;height:22px;stroke-width:2}
.folder b{font-size:13.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);line-height:1.2}
.folder:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.finder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;padding:22px 24px 28px}
.fitem{all:unset;cursor:pointer;display:grid;justify-items:center;gap:8px;text-align:center;padding:10px 6px;border-radius:10px}
.fitem:hover,.fitem:focus-visible{background:rgba(47,111,236,.1)}
.fitem .th{width:112px;aspect-ratio:4/3;border-radius:8px;background-size:cover;background-position:center;box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 0 0 1px rgba(0,0,0,.08)}
.fitem .th.gan{background:radial-gradient(circle at 30% 30%,#3a5fd9,transparent 60%),radial-gradient(circle at 70% 70%,#d93a6a,transparent 55%),#141a2e}
.fitem .pdf{width:72px;height:90px;border-radius:4px 16px 4px 4px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 0 0 1px rgba(0,0,0,.1);display:grid;align-content:end;justify-items:center;padding:8px;gap:3px}
.fitem .pdf i{display:block;width:44px;height:2px;background:#d6dae2}
.fitem .pdf b{font-size:10px;font-weight:700;color:#fff;background:#e8456b;padding:1px 6px;border-radius:3px;margin-top:4px}
.fitem>span{font-size:13.5px;font-weight:500;line-height:1.3;max-width:150px}
.fitem small{display:block;font-size:12px;color:var(--soft);font-weight:400;margin-top:2px}
.fpath{display:flex;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--soft);background:rgba(240,242,246,.75)}
.grp.note{background:color-mix(in srgb,var(--accent) 12%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.grp.note .row{flex-wrap:wrap}
.card.hl{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- windows ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win-bg);border:var(--win-border);border-radius:var(--win-radius);box-shadow:var(--win-shadow);overflow:hidden;min-width:280px;max-width:calc(100% - 24px);max-height:calc(100% - 110px);z-index:10;transition:opacity .18s,transform .18s}
.win.opening{opacity:0;transform:scale(.96) translateY(8px)}
.win:not(.front){--tb-fg:#98a1b0}
.tb{flex:none;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;height:var(--tb-h);background:var(--tb-bg);border-bottom:var(--tb-border);color:var(--tb-fg);cursor:grab;user-select:none;touch-action:none;padding:0 14px}
.tb:active{cursor:grabbing}
.lights{display:flex;gap:8px}
.lights button{all:unset;cursor:pointer;width:12px;height:12px;border-radius:50%;background:#dfe2e8;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.win.front .lights .c{background:#ff5f57}.win.front .lights .m{background:#febc2e}.win.front .lights .z{background:#28c840}
.lights button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tt{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden}
.tt svg{width:15px;height:15px;opacity:.7}
.w95b{display:none}
.bd{flex:1;overflow:auto;min-height:0}
.win.max{left:12px!important;top:12px!important;width:calc(100% - 24px)!important;height:calc(100% - 110px)!important}

/* ---------- dock ---------- */
.dock{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:800;display:flex;gap:6px;padding:10px 14px;border-radius:24px;background:rgba(225,236,248,.5);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.65);box-shadow:0 10px 30px rgba(10,30,60,.25);max-width:calc(100% - 24px);overflow:visible}
.dock button{all:unset;cursor:pointer;position:relative;display:grid;place-items:center;width:56px;height:56px;border-radius:14px;transition:transform .15s}
.dock button:hover{transform:translateY(-4px)}
.dock button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.dock .ic{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;color:#1d2433}
.dock .ic svg{width:30px;height:30px}
.dock button.run::after{content:"";position:absolute;bottom:-5px;width:5px;height:5px;border-radius:50%;background:#1d2433}
.dock button .tip{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);background:rgba(20,26,38,.85);color:#fff;font-size:12px;padding:3px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dock button:hover .tip{opacity:1}
.taskbar{display:none}
.startmenu{display:none}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.xi{fill:#000;stroke:none}
.dock .ic.x{background:none!important;box-shadow:none!important;border-radius:0!important}
.dock .ic.x svg{width:48px;height:48px}
.sysicons .si.x{background:none!important;border:0!important;width:40px;height:40px}
.sysicons .si.x svg{width:40px;height:40px}
.startmenu .x svg,.startmenu svg.xi{width:22px;height:22px}
#os[data-era="2007"] .dock .ic.x{-webkit-box-reflect:below 3px linear-gradient(transparent 55%,rgba(255,255,255,.3))}
#os[data-era="2007"] .dock .tip,#os[data-era="2001"] .dock .tip{background:rgba(0,0,0,.75);border-radius:12px}
#os[data-era="2001"] .dock .tip{bottom:72px}

/* ---------- app content (shared) ---------- */
.pad{padding:28px 32px 32px}
.muted{color:var(--soft)}
.about-h{display:flex;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.avatar{width:84px;height:84px;border-radius:50%;background:url(assets/os/face.jpg) center/cover;flex:none}
.about-h h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.about-h p{margin:4px 0 0;color:var(--soft);font-size:16px}
.about-h .status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:4px 11px 4px 9px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:500;color:var(--fg);line-height:1.3}
.about-h .status i{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);flex:none}
.prose p{margin:0 0 16px;font-size:16px;line-height:1.65;max-width:62ch}
.prose b{font-weight:600}
.lnk{cursor:pointer;font-weight:600;border-bottom:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.lnk:hover{color:var(--accent)}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.work{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%;min-height:0}
.side{background:rgba(240,242,246,.75);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side h4{margin:10px 10px 6px;font-size:12.5px;font-weight:500;color:var(--soft)}
.side h4:first-child{margin-top:0}
.side button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;font-size:14.5px}
.side button:hover{background:rgba(0,0,0,.04)}
.side button.on{background:rgba(0,0,0,.07);font-weight:600}
.side button:focus-visible{outline:2px solid var(--accent)}
.side .th{width:24px;height:24px;border-radius:6px;background-size:cover;background-position:center;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.side svg{width:18px;height:18px;opacity:.75}
.side .sfoot{margin-top:auto;padding:16px 10px 0;font-size:12.5px;color:var(--soft);line-height:1.45}
.side .sfoot b{display:block;color:var(--fg)}
.wmain{padding:28px 32px;overflow:auto;min-width:0}
.whead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.whead h2{margin:0;font-size:34px;letter-spacing:-.025em;font-weight:600;line-height:1.05;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.whead h2 small{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--soft);letter-spacing:0}
.btn{all:unset;cursor:pointer;background:#111;color:#fff;font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:var(--chip);color:var(--fg)}
.wdesc{font-size:16.5px;line-height:1.6;margin:12px 0 22px;max-width:62ch}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.shot{display:grid;gap:8px}
.shot .im{aspect-ratio:4/3;border-radius:12px;background-color:#e9ecf1;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.shot .im.gan{background:radial-gradient(circle at 30% 30%,#3a5fd9,transparent 60%),radial-gradient(circle at 70% 70%,#d93a6a,transparent 55%),#141a2e;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:13px;text-align:center;line-height:1.5}
.shot b{font-size:15px}
.shot span{font-size:14px;color:var(--soft);line-height:1.45}

.list{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:6px}
button.card{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:6px}
button.card:hover{border-color:#c9cfd9}
button.card:focus-visible{outline:2px solid var(--accent)}
.card .k{font-size:13px;color:var(--soft)}
.card h3{margin:0;font-size:19px;font-weight:500;letter-spacing:-.01em}
.card p{margin:0;font-size:15px;color:var(--soft);line-height:1.5}
.card a{color:var(--accent);font-size:13.5px;font-weight:500;text-decoration:none}
.sect{font-size:13px;color:var(--soft);font-weight:500;margin:0 0 14px}
.sect.mt{margin-top:28px}
.post{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
button.card.post{gap:16px;text-align:left}
.post .im{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center}

.doc{background:#fff;margin:22px auto;max-width:640px;padding:36px 40px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:4px;font-size:14.5px;line-height:1.5;color:#1b1f27}
.doc h1{margin:0;font-size:26px;letter-spacing:-.015em}
.doc .ct{color:#667085;font-size:13px;margin:4px 0 0}
.doc h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#2f6fec;margin:22px 0 8px;border-bottom:1px solid #e4e7ec;padding-bottom:4px}
.doc .r{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.doc .r span{color:#667085;font-variant-numeric:tabular-nums;font-size:13px}
.doc ul{margin:4px 0 10px;padding-left:18px}
.doc p{margin:2px 0 8px}
.embed{display:flex;flex-direction:column;height:100%}.embed iframe{flex:1;width:100%;border:0;background:#fff;min-height:0}
.win[data-app="abs"] .bd,.win[data-app="post"] .bd{overflow:hidden}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(240,242,246,.75);font-size:13px;color:var(--soft);position:sticky;top:0}

.tm{padding:22px 28px 26px;text-align:center}
.tm h2{margin:0;font-size:22px;font-weight:600}
.tm .sub{margin:4px 0 18px;color:var(--soft)}
.tmcard{text-align:left;background:#f5f6f8;border:1px solid var(--line);border-radius:12px;padding:20px 24px;min-height:150px}
.tmcard .yr{display:flex;align-items:center;gap:12px;font-size:44px;font-weight:500;letter-spacing:-.02em;line-height:1}
.tmcard .yr span{font-size:12px;font-weight:600;letter-spacing:.06em;background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px}
.tmcard h3{margin:12px 0 4px;font-size:18px;font-weight:400}
.tmcard h3 em{font-style:normal;color:var(--soft)}
.tmcard p{margin:0;color:var(--soft);font-size:15px;line-height:1.55}
.tl{display:flex;align-items:flex-start;justify-content:center;margin:26px 0 18px;overflow-x:auto;padding:4px}
.tl .st{display:grid;justify-items:center;gap:8px;font-size:12.5px;color:var(--soft);flex:none}
.tl .st.on{color:var(--fg);font-weight:700}
.tl button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--fg);background:#fff}
.tl button.past{border-color:#cdd3dd;color:#9aa3b2}
.tl .st.on button{background:var(--accent);color:#fff}
.tl button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tl i{display:block;width:30px;height:2px;background:var(--accent);margin-top:20px;flex:none}
.tl i.past{background:#dfe3ea}
.keys{font-size:12.5px;color:var(--soft)}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:#fafbfc}

.set{padding:24px 28px;display:grid;gap:12px}
.set h4{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--soft)}
.grp{background:#eef0f4;border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.grp .hd b{display:block;font-size:16px;font-weight:500}
.grp .hd span{font-size:14px;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;background:#e1e4ea;font-size:14px}
.chips button.on{background:#c9cdd5;box-shadow:inset 0 0 0 1px #9aa1ad;font-weight:500}
.chips button:focus-visible{outline:2px solid var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tog{all:unset;cursor:pointer;width:46px;height:26px;border-radius:999px;background:#c9cdd5;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-checked="true"]{background:#34c759}
.tog[aria-checked="true"]::after{left:23px;background:#111}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sys{font-family:var(--mono);font-size:13.5px;display:grid;gap:8px}
.sys div{display:flex;justify-content:space-between;gap:12px}
.sys span{color:var(--soft)}

/* ---------- phone ---------- */

function drag(w){

    if(e.target.closest('button')||matchMedia('(max-width:700px)').matches||w.classList.contains('max'))return;
    const sx=e.clientX,sy=e.clientY,ox=w.offsetLeft,oy=w.offsetTop;tb.setPointerCapture(e.pointerId);
    const mv=ev=>{w.style.left=Math.min(desk.clientWidth-80,Math.max(-w.offsetWidth+120,ox+ev.clientX-sx))+'px';w.style.top=Math.min(desk.clientHeight-60,Math.max(0,oy+ev.clientY-sy))+'px';};
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};

  });
}

var WXLIVE={place:'Dallas–Fort Worth',lat:32.78,lon:-96.8,mine:false,kind:null,label:'',t:null};

function wmoKind(c){
  if(c===0||c===1)return['clear',c?'Mostly clear':'Clear'];
  if(c===2)return['partly','Partly cloudy'];
  if(c===3)return['overcast','Overcast'];
  if(c===45||c===48)return['foggy','Foggy'];
  if((c>=51&&c<=67)||(c>=80&&c<=82))return['rainy',c>=61?'Rainy':'Drizzly'];
  if((c>=71&&c<=77)||c===85||c===86)return['snowy','Snowy'];
  if(c>=95)return['stormy','Thunderstorms'];
  return['clear','Clear'];
}
async function wxFetch(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WXLIVE.lat}&longitude=${WXLIVE.lon}&current=weather_code,temperature_2m&temperature_unit=fahrenheit&timezone=auto`);
    const j=await r.json(),c=j.current;if(!c)return;
    const [k,l]=wmoKind(c.weather_code);WXLIVE.kind=k;WXLIVE.label=`${l}, ${Math.round(c.temperature_2m)}°F`;SEA.state.live=k;
    if(typeof renderSettings==='function')renderSettings();
  }catch(e){}
}

/* snake, inside the terminal. Arrows/WASD or swipe; Q or Esc quits. */
function snake(print,box,done){
  const N=20,cs=Math.max(10,Math.min(16,Math.floor((box.clientWidth-40)/N)));
  const d=print('','tgame');d.innerHTML=`<div class="sk-h"><span>SNAKE</span><span class="sk-s">score 0 · best ${+(localStorage.getItem('poshakos-snake')||0)}</span></div><canvas width="${N*cs}" height="${N*cs}"></canvas><div class="tdim">Arrows or WASD to move, swipe on a phone. Q to quit.</div>`;
  const c=d.querySelector('canvas'),x=c.getContext('2d'),sc=d.querySelector('.sk-s');box.scrollTop=box.scrollHeight;
  let s=[[10,10],[9,10],[8,10]],dir=[1,0],nd=[1,0],food=[15,10],score=0,alive=true,best=+(localStorage.getItem('poshakos-snake')||0);
  const place=()=>{do{food=[Math.random()*N|0,Math.random()*N|0];}while(s.some(p=>p[0]===food[0]&&p[1]===food[1]));};
  const key=e=>{const k=e.key.toLowerCase();const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
    if(m){e.preventDefault();e.stopPropagation();if(m[0]!==-dir[0]||m[1]!==-dir[1])nd=m;}else if(k==='q'||k==='escape'){e.preventDefault();e.stopPropagation();stop('Quit.');}};
  let tx=0,ty=0;const ts=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},te=e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;const m=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];if(m[0]!==-dir[0]||m[1]!==-dir[1])nd=m;};
  document.addEventListener('keydown',key,true);c.addEventListener('touchstart',ts,{passive:true});c.addEventListener('touchend',te);
  const css=getComputedStyle(box),fg=css.color,ac='#3cff7a',fd='#ff5f6d';
  const draw=()=>{x.clearRect(0,0,c.width,c.height);x.fillStyle=fd;x.fillRect(food[0]*cs+2,food[1]*cs+2,cs-4,cs-4);s.forEach((p,i)=>{x.fillStyle=i?fg:ac;x.fillRect(p[0]*cs+1,p[1]*cs+1,cs-2,cs-2);});};
  const stop=msg=>{if(!alive)return;alive=false;clearInterval(t);document.removeEventListener('keydown',key,true);
    if(score>best){best=score;try{localStorage.setItem('poshakos-snake',best)}catch(e){}msg+=' New best!';}
    print(`${msg} Score: ${score}.`);done();};
  const t=setInterval(()=>{
    if(!c.isConnected)return stop('');
    dir=nd;const h=[s[0][0]+dir[0],s[0][1]+dir[1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]===h[0]&&p[1]===h[1])){blip(160);return stop('Game over.');}
    s.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;blip(900);place();sc.textContent=`score ${score} · best ${Math.max(best,score)}`;}else s.pop();draw();
  },110);
  draw();
}

function setPhone(){os.classList.toggle('phone',PHONE.matches);}
try{PHONE.addEventListener('change',setPhone)}catch(e){PHONE.addListener(setPhone)}
